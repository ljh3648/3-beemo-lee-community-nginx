worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 파일 업로드 크기 제한 (10MB)
    client_max_body_size 10M;
    
    # [핵심] Docker 내부 DNS Resolver 설정
    # 이걸 설정해야 컨테이너가 하나만 떠 있어도 Nginx가 죽지 않고 켜집니다.
    resolver 127.0.0.11 valid=30s;

    # 로컬 개발용 HTTP 서버
    server {
        listen 80;
        server_name localhost;

        # Frontend (Web Server)
        location / {
            # 변수로 설정하여 Nginx 시작 시 호스트 존재 여부 체크를 건너뜀
            set $upstream_web http://web-server:3000;
            
            proxy_pass $upstream_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend (API Server)
        location /api {
            # 변수로 설정하여 Nginx 시작 시 호스트 존재 여부 체크를 건너뜀
            set $upstream_api http://api-server:8080;
            
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}