user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Docker 컨테이너 DNS 해석
    resolver 127.0.0.11:53 valid=10s;
    resolver_timeout 5s;

    # Docker Registry 대용량 업로드 지원
    client_max_body_size 2G;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    # http 요청 -> https 리다이렉트
    server {
        listen 80;
        server_name idontwannabeyouanymore.com *.idontwannabeyouanymore.com;
        return 301 https://$server_name$request_uri;
    }

    # https -> community WS, WAS 전송
    server {
        listen 443 ssl;
        server_name dev.idontwannabeyouanymore.com;

        # ssl 인증서
        ssl_certificate /etc/letsencrypt/live/idontwannabeyouanymore.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/idontwannabeyouanymore.com/privkey.pem;

        # WAS
        location /api {
            set $upstream_was http://dev-community-was:8080;
            proxy_pass $upstream_was;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # WS
        location / {
            set $upstream_ws http://dev-community-ws:3000;
            proxy_pass $upstream_ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # https -> portainer 전송
    server {
        listen 443 ssl;
        server_name portainer.idontwannabeyouanymore.com;

        # ssl 인증서
        ssl_certificate /etc/letsencrypt/live/idontwannabeyouanymore.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/idontwannabeyouanymore.com/privkey.pem;

        location / {
            set $upstream_portainer http://portainer:9000;
            proxy_pass $upstream_portainer;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # https -> registry 전송
    server {
        listen 443 ssl;
        server_name registry.idontwannabeyouanymore.com;

        # ssl 인증서
        ssl_certificate /etc/letsencrypt/live/idontwannabeyouanymore.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/idontwannabeyouanymore.com/privkey.pem;

        location / {
            set $upstream_registry http://registry:5000;
            proxy_pass $upstream_registry;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}