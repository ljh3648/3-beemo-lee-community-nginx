services:
  nginx:
    image: ${NGINX_IMG_NAME}:${NGINX_IMG_TAG}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ssl_data:/app/ssl/letsencrypt:ro
    env_file:
      - .env
    environment:
      - DOMAIN=${DOMAIN}
      - WS_HOST=${WS_HOST}
      - WS_PORT=${WS_PORT}
      - API_SERVER_HOST=${API_SERVER_HOST}
      - API_SERVER_PORT=${API_SERVER_PORT}
    # [수정] $$를 사용하여 Docker Compose가 변수를 해석하지 않게 하고, 쉘에서 $로 인식되게 함
    command: /bin/sh -c "envsubst '$$DOMAIN $$WS_HOST $$WS_PORT $$API_SERVER_HOST $$API_SERVER_PORT' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    restart: always

volumes:
  ssl_data:
    external: true
